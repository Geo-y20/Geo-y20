<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="George Youhana Heazil — AI Engineer building LLM systems, RAG and AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace; }
      .node { fill: #111A2E; stroke: #334155; stroke-width: 1.2; }
      .ntitle { fill: #E2E8F0; font-size: 15px; font-weight: 600; }
      .nsub { fill: #64748B; font-size: 11px; }
      .wire { fill: none; stroke: #334155; stroke-width: 1.5; }
      .flow { fill: none; stroke: url(#accent); stroke-width: 1.8; stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.45"/>
    <rect width="1200" height="340" fill="url(#glowA)"/>
    <rect width="1200" height="340" fill="url(#glowB)"/>
    <rect width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#1E293B"/>

  <!-- Left: identity -->
  <text x="64" y="92" class="mono" font-size="15" fill="#22D3EE">$ whoami<tspan class="blink" fill="#22D3EE"> ▍</tspan></text>
  <text x="64" y="152" class="sans" font-size="50" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">George Youhana Heazil</text>
  <text x="64" y="194" class="sans" font-size="22" fill="#94A3B8">AI Engineer  ·  LLM Systems  ·  RAG  ·  AI Agents</text>
  <text x="64" y="226" class="sans" font-size="16" fill="#64748B">Shipping production AI used by 900+ employees across 20+ departments</text>

  <g class="mono" font-size="13">
    <rect x="64" y="252" width="132" height="32" rx="16" fill="#0F1B2D" stroke="#1E3A5F"/>
    <text x="130" y="273" text-anchor="middle" fill="#7DD3FC">Cairo, Egypt</text>

    <rect x="208" y="252" width="146" height="32" rx="16" fill="#0F1B2D" stroke="#1E3A5F"/>
    <text x="281" y="273" text-anchor="middle" fill="#7DD3FC">@ EVA Group</text>

    <rect x="366" y="252" width="232" height="32" rx="16" fill="#0E2420" stroke="#14532D"/>
    <circle cx="386" cy="268" r="4.5" fill="#22C55E" class="pulse"/>
    <text x="490" y="273" text-anchor="middle" fill="#86EFAC">Open to Applied AI roles</text>
  </g>

  <!-- Right: live RAG pipeline -->
  <circle cx="718" cy="66" r="4" fill="#22C55E" class="pulse"/>
  <text x="730" y="70" class="mono" font-size="12" fill="#64748B">rag_pipeline · production</text>

  <path class="wire" d="M770 116 H1090 V236 H770"/>
  <path class="flow" d="M770 116 H1090 V236 H770"/>

  <circle r="4" fill="#22D3EE">
    <animateMotion dur="4s" repeatCount="indefinite" path="M770 116 H1090 V236 H770"/>
  </circle>
  <circle r="4" fill="#818CF8">
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M770 116 H1090 V236 H770"/>
  </circle>

  <g class="sans" text-anchor="middle">
    <rect class="node" x="708" y="88" width="124" height="56" rx="10"/>
    <text class="ntitle" x="770" y="113">Query</text>
    <text class="nsub mono" x="770" y="131">NL · Arabic/EN</text>

    <rect class="node" x="868" y="88" width="124" height="56" rx="10"/>
    <text class="ntitle" x="930" y="113">Retrieve</text>
    <text class="nsub mono" x="930" y="131">pgvector + BM25</text>

    <rect class="node" x="1028" y="88" width="124" height="56" rx="10"/>
    <text class="ntitle" x="1090" y="113">Rerank</text>
    <text class="nsub mono" x="1090" y="131">cross-encoder</text>

    <rect class="node" x="1028" y="208" width="124" height="56" rx="10"/>
    <text class="ntitle" x="1090" y="233">LLM Router</text>
    <text class="nsub mono" x="1090" y="251">GPT · Claude</text>

    <rect class="node" x="868" y="208" width="124" height="56" rx="10"/>
    <text class="ntitle" x="930" y="233">Agents</text>
    <text class="nsub mono" x="930" y="251">LangGraph · tools</text>

    <rect x="708" y="208" width="124" height="56" rx="10" fill="#0F1B2D" stroke="#22D3EE" stroke-width="1.4"/>
    <text class="ntitle" x="770" y="233">Answer</text>
    <text class="nsub mono" x="770" y="251">Teams · Web</text>
  </g>

  <text x="930" y="306" class="mono" font-size="12" fill="#475569" text-anchor="middle">guardrails · memory · token/cost monitoring</text>
</svg>
